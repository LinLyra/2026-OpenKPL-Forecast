    <script>
      window.AegisV2 = new Aegis({
        id: 'SDK-90fee0510690a2bdf1ff',
        hostUrl: {
          url: 'https://galileotelemetry.tencent.com/collect',
        },
        env: 'production',
        plugin: {
          pv: true,
          aid: true,
          error: true,
          device: true,
          close: true,
          pagePerformance: true,
          webVitals: true,
          spa: true,
          api: true,
          assetSpeed: true,
          session: true,
          fId: false,
          ie: false,
        },
      });
      // 初始化后立即设置 uid，确保所有上报数据都带用户标识
      (function() {
        var uid = localStorage.getItem('uuid');
        if (!uid) {
          uid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0;
            return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
          });
          localStorage.setItem('uuid', uid);
        }
        window.AegisV2.setConfig({ uid: uid });
      })();
    </script>

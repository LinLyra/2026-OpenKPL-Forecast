# 2026 KPL Annual Finals — tournament rule manifest (STRUCTURE ONLY; no competitive outcome).
# Written 2026-09-29 BEFORE any tournament simulation was run. Scenario definitions and the materiality
# threshold below are pre-registered and must not be changed after seeing simulation output.
#
# verification_status vocabulary:
#   VERIFIED_OFFICIAL            stated verbatim in an official KPL post
#   VERIFIED_OFFICIAL_IMPLIED    follows necessarily from official text (no interpretation needed)
#   SECONDARY_TRANSCRIPTION      transcription (Wikipedia/guide) of official material not available as text
#   SECONDARY_INTERPRETATION     a secondary source's reading of an ambiguous official rule
#   UNRESOLVED                   not found in any source; handled only by bounded scenarios
#
# Information timing: all sources were RETRIEVED 2026-09-29, i.e. after the information cutoff, so every rule
# carries post_cutoff_structure_information: true (POST_CUTOFF_STRUCTURE_INFORMATION). All official items were
# PUBLISHED 2026-09-20..22, before the cutoff. No source contained any Annual Finals result.

manifest_version: "1.0"
information_cutoff:
  value: "2026-09-28 00:00:00"
  timezone: Asia/Shanghai
  inclusive: false
  source: "openkpl.evaluation.benchmark.MODEL_FREEZE_DATE (established v0.3 freeze; development_cutoff_exclusive)"
  notes: >
    The project's established cutoff is stricter than the suggested 2026-09-28 23:59:59 and equivalent in content:
    the last KPL series before the Annual Finals was 2026-09-12 and none occurred between 2026-09-13 and 2026-10-01.


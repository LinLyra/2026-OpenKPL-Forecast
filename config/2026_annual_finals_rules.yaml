  OFFICIAL_PARTICIPANTS: {url: "https://news.qq.com/rain/a/20260921A06HJ500", publisher: "KPL official account", published: "2026-09-21 18:44", capture: "data/raw/tournament_structure/2026-09-29/official_kpl_participants_post_20260921.txt"}
  WIKIPEDIA: {url: "https://zh.wikipedia.org/wiki/王者荣耀职业联赛2026年年度总决赛", publisher: "Wikipedia (secondary; cites official posts 2026-09-20/21)", published: "live page", capture: "data/raw/tournament_structure/2026-09-29/wikipedia_2026_annual_finals_excerpt.txt"}
  SECONDARY: {url: "several (Hupu 2026-09-20, 17173 2026-09-22, globalgameguide)", publisher: "secondary media", published: "2026-09-20..28", capture: "data/raw/tournament_structure/2026-09-29/secondary_sources_excerpt.txt"}
  KPL_API: {url: "https://kplshop-op.timi-esports.qq.com/kplow", publisher: "official data API", published: "n/a", capture: "data/raw/tournament_structure/2026-09-29/kpl_api_probe_20260929.json"}


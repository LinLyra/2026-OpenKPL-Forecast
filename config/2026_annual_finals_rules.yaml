rules:
  - id: R01_PARTICIPANTS_AND_GROUPS
    rule: "12 teams; Master = annual points 1-6, Elite = 7-12; group membership as listed under teams"
    source: OFFICIAL_PARTICIPANTS
    source_date: "2026-09-21"
    retrieved_at: "2026-09-29"
    verification_status: VERIFIED_OFFICIAL
    post_cutoff_structure_information: true
    notes: "Within-group seed order (annual points) is from the Wikipedia points table; it is not used by any stage-1 ranking rule."
  - id: R02_STAGE_DATES
    rule: "擂台赛 2026-10-02..10-18; 突围赛 10-20..10-22; 淘汰赛 10-27..11-08; 总决赛 11-14"
    source: OFFICIAL_FORMAT
    source_date: "2026-09-20"
    retrieved_at: "2026-09-29"
    verification_status: VERIFIED_OFFICIAL
    post_cutoff_structure_information: true
    notes: ""
  - id: R03_STAGE1_FORMAT
    rule: "Cross-group single round robin, BO5: every Master team plays every Elite team exactly once (36 series); no intra-group series; the two groups are ranked independently"
    source: OFFICIAL_FORMAT
    source_date: "2026-09-20"
    retrieved_at: "2026-09-29"
    verification_status: VERIFIED_OFFICIAL
    post_cutoff_structure_information: true
    notes: "The 36 pairings follow necessarily from the official rule (VERIFIED_OFFICIAL_IMPLIED); only dates depend on R04."
  - id: R04_STAGE1_SCHEDULE_DATES
    rule: "Stage 1 dates/order as listed under stage1_schedule"
    source: WIKIPEDIA
    source_date: "2026-09-20 (official image)"
    retrieved_at: "2026-09-29"
    verification_status: SECONDARY_TRANSCRIPTION
    post_cutoff_structure_information: true
    notes: >
      Official schedule exists only as an image. Wikipedia transcription: 36 series, each Master-Elite pair exactly once
      (checked in code). Opening day (TTG-DYG, KSG-RW, AG-Hero) independently confirmed by the Hupu headline and a guide.
      Dates only affect the prediction ledger, not any probability (frozen strength; no within-tournament updating).
  - id: R05_STAGE1_ADVANCEMENT
    rule: "Master #1-#4 and Elite #1 -> knockout; Master #5-#6 and Elite #2-#5 -> breakthrough; Elite #6 eliminated"
    source: OFFICIAL_FORMAT
    source_date: "2026-09-20"
    retrieved_at: "2026-09-29"
    verification_status: VERIFIED_OFFICIAL
    post_cutoff_structure_information: true
    notes: ""
  - id: R06_STAGE1_RANKING_AND_TIEBREAK
    rule: "UNKNOWN. Official text only says groups are ranked independently."
    source: WIKIPEDIA
    source_date: "n/a"
    retrieved_at: "2026-09-29"
    verification_status: UNRESOLVED
    post_cutoff_structure_information: true
    notes: >
      Wikipedia's empty standings table has columns 胜/负/积分/净胜局 (wins, losses, points, game differential), which suggests
      wins and game differential matter, but no ranking order, points scheme or final tiebreak (加赛/lot) is published.
      Head-to-head cannot break ties because same-group teams never meet. Handled by bounded scenarios
      stage1_tiebreak_scenarios; the probability mass reaching each criterion is reported.
  - id: R07_MASTER_ROTATION
    rule: "Every Master team must field all 7 registered players for at least one game in every stage-1 BO5; Elite teams exempt; not applicable after stage 1"
    source: OFFICIAL_FORMAT
    source_date: "2026-09-20"
    retrieved_at: "2026-09-29"
    verification_status: VERIFIED_OFFICIAL
    post_cutoff_structure_information: true
    notes: "Stage-1-only scope per Wikipedia and a guide (SECONDARY). PRIMARY forecast does not adjust B5 for this rule (v0.5 rejected roster adjustments)."
  - id: R08_BREAKTHROUGH_FORMAT
    rule: "6 teams (Master #5, #6, Elite #2-#5); BO7 (global BP + 巅峰对决); single elimination; 3 winners advance"
    source: OFFICIAL_FORMAT
    source_date: "2026-09-20"
    retrieved_at: "2026-09-29"
    verification_status: VERIFIED_OFFICIAL
    post_cutoff_structure_information: true
    notes: ""
  - id: R09_BREAKTHROUGH_SELECTION
    rule: "Higher-positioned teams choose opponents in sequence (高顺位队伍依次挑选对手)"
    source: OFFICIAL_FORMAT
    source_date: "2026-09-20"
    retrieved_at: "2026-09-29"
    verification_status: VERIFIED_OFFICIAL
    post_cutoff_structure_information: true
    notes: "Strategic choice is officially allowed, so OPTIMAL_SELECTION is PRIMARY. Selection takes place at the 10-18 ceremony (guide)."
  - id: R10_BREAKTHROUGH_SELECTION_DETAIL
    rule: "Master #5 chooses first from Elite #2-#5; Master #6 chooses from the remaining three; the last two Elite teams play each other"
    source: WIKIPEDIA
    source_date: "2026-09-20/21 (cited)"
    retrieved_at: "2026-09-29"
    verification_status: SECONDARY_INTERPRETATION
    post_cutoff_structure_information: true
    notes: >
      Derived from Wikipedia placeholders: match 1 (10-20) "D5 vs J", match 2 (10-21) "D6 vs J", match 3 (10-22) "J vs J".
      Alternative reading (any remaining team may be chosen, incl. M5 choosing M6) is run as scenario SELECTION_POOL_ANY.
  - id: R11_KNOCKOUT_FORMAT
    rule: "8 teams; BO7 (global BP + 巅峰对决) double elimination; the two surviving teams contest the final"
    source: OFFICIAL_FORMAT
    source_date: "2026-09-20"
    retrieved_at: "2026-09-29"
    verification_status: VERIFIED_OFFICIAL
    post_cutoff_structure_information: true
    notes: ""
  - id: R12_KNOCKOUT_BRACKET_WIRING
    rule: "As in knockout_bracket (UB QF1-4; UB SF W1-W2, W3-W4; LB R1 L1-L3, L2-L4; LB R2 W(LB1a)-L(SF1), W(LB1b)-L(SF2); UBF; LBSF; LBF L(UBF)-W(LBSF); final UBF winner vs LBF winner)"
    source: WIKIPEDIA
    source_date: "2026-09-20/21 (cited)"
    retrieved_at: "2026-09-29"
    verification_status: SECONDARY_TRANSCRIPTION
    post_cutoff_structure_information: true
    notes: "Wiring and dates from the Wikipedia bracket; consistent with the official 10-27..11-08 window (13 knockout dates)."
  - id: R13_KNOCKOUT_DRAW
    rule: "First-round pairings are decided by draw; Master #1 and #2 have seed slots"
    source: OFFICIAL_FORMAT
    source_date: "2026-09-20"
    retrieved_at: "2026-09-29"
    verification_status: VERIFIED_OFFICIAL
    post_cutoff_structure_information: true
    notes: >
      The meaning of a seed slot (bracket position, opponent pot, same-group restriction) is NOT published. A guide says
      seeds "won't meet in the first round" (SECONDARY_INTERPRETATION). Handled by knockout_draw_scenarios. The draw is
      held 10-22 (guide), after the cutoff, so PRIMARY simulates it; no realized bracket is used.
  - id: R14_FINAL
    rule: "Final 2026-11-14, BO7, UBF winner vs LBF winner; no carried advantage stated"
    source: WIKIPEDIA
    source_date: "2026-09-20/21 (cited)"
    retrieved_at: "2026-09-29"
    verification_status: SECONDARY_TRANSCRIPTION
    post_cutoff_structure_information: true
    notes: >
      Venue 五粮液文化体育中心综合体育馆 (Phoenix Mountain Sports Park, Chengdu). No source mentions a game advantage, side
      choice advantage or bracket reset for the upper-bracket team; modeled as a neutral BO7 (B5 is format-agnostic anyway).
  - id: R15_PLAYER_LOANS
    rule: "Each team may loan at most one player from non-qualified KPL clubs' summer rosters (loan window 09-13..09-16)"
    source: SECONDARY
    source_date: "2026-09 (official Weibo quoted by Sina)"
    retrieved_at: "2026-09-29"
    verification_status: SECONDARY_TRANSCRIPTION
    post_cutoff_structure_information: true
    notes: "Not used by PRIMARY (no roster adjustment). Listed as a known limitation (e.g. Fly loaned to 重庆狼队 per Wikipedia roster)."


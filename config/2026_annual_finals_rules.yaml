breakthrough:
  selection_order: [M5, M6]          # R10
  selectable_pool: ELITE_2_TO_5      # R10; alternative ANY_REMAINING in scenario SELECTION_POOL_ANY
  matches: [["2026-10-20", M5, CHOSEN_BY_M5], ["2026-10-21", M6, CHOSEN_BY_M6], ["2026-10-22", REMAINING_1, REMAINING_2]]
  format: BO7

knockout_bracket:   # slots s0..s7; QF1=(s0,s1) QF2=(s2,s3) QF3=(s4,s5) QF4=(s6,s7); half A = QF1,QF2; half B = QF3,QF4
  QF1: {date: "2026-10-27", a: s0, b: s1}
  QF2: {date: "2026-10-28", a: s2, b: s3}
  QF3: {date: "2026-10-29", a: s4, b: s5}
  QF4: {date: "2026-10-30", a: s6, b: s7}
  LB1A: {date: "2026-10-31", a: L_QF1, b: L_QF3}
  LB1B: {date: "2026-11-01", a: L_QF2, b: L_QF4}
  SF1: {date: "2026-11-02", a: W_QF1, b: W_QF2}
  SF2: {date: "2026-11-03", a: W_QF3, b: W_QF4}
  LB2A: {date: "2026-11-04", a: W_LB1A, b: L_SF1}
  LB2B: {date: "2026-11-05", a: W_LB1B, b: L_SF2}
  UBF: {date: "2026-11-06", a: W_SF1, b: W_SF2}
  LBSF: {date: "2026-11-07", a: W_LB2A, b: W_LB2B}
  LBF: {date: "2026-11-08", a: L_UBF, b: W_LBSF}
  FINAL: {date: "2026-11-14", a: W_UBF, b: W_LBF}
  format: BO7

scenarios:
  primary:
    stage1_tiebreak: T1_WINS_GAMEDIFF_LOT
    breakthrough_selection: OPTIMAL_SELECTION
    selection_pool: ELITE_2_TO_5
    knockout_draw: K1_SEEDS_OPPOSITE_HALVES
    probability_transform: PRIMARY
  stage1_tiebreak_scenarios:
    T1_WINS_GAMEDIFF_LOT: "series wins, then game differential (净胜局), then uniform lot (stand-in for 加赛/unknown)"
    T2_WINS_LOT: "series wins, then uniform lot (game differential ignored)"
    T3_WINS_GAMEDIFF_STRENGTH: "series wins, then game differential, then a strength-weighted playoff proxy (Plackett-Luce on frozen B5 ratings)"
  breakthrough_selection_scenarios:
    OPTIMAL_SELECTION: "selector picks the legal opponent maximizing its own frozen-B5 BO7 win probability (PRIMARY: choice officially allowed)"
    RANDOM_LEGAL_SELECTION: "uniform over legal opponents"
    ADVERSARIAL_SELECTION: "selector picks the legal opponent minimizing its own win probability (the knockout draw after the breakthrough is random, so the least favorable downstream path reduces to the strongest opponent)"
  selection_pool_scenarios:
    ELITE_2_TO_5: "R10 reading"
    SELECTION_POOL_ANY: "any remaining breakthrough team may be chosen (M5 may choose M6)"
  knockout_draw_scenarios:
    K1_SEEDS_OPPOSITE_HALVES: "M1 and M2 drawn into opposite halves (one per half, random QF within half); other 6 teams randomly fill the remaining 6 slots"
    K2_SEEDS_NOT_PAIRED: "uniform random pairing of all 8 subject only to M1 and M2 not meeting in the first round (guide's reading)"
    K3_SEEDS_OPPOSITE_HALVES_VS_BREAKTHROUGH: "as K1, and each seed's first-round opponent is drawn from the 3 breakthrough qualifiers"
  probability_transforms:   # applied to the series log-odds z = logit(p_B5): p' = sigmoid(lambda * z)
    PRIMARY: {bo5_lambda: 1.0, bo7_lambda: 1.0}
    CONSERVATIVE: {bo5_lambda: 0.85, bo7_lambda: 0.85}
    AGGRESSIVE: {bo5_lambda: 1.15, bo7_lambda: 1.15}
    BO7_SENSITIVITY: {bo5_lambda: 1.0, bo7_lambda: 1.161}
    notes: >
      0.85 ~ the B5 BO5 historical calibration slope (v0.6: 0.83) and overall slope (0.90); 1.15 is the symmetric expansion.
      1.161 = v0.6.1 pooled strong-shrinkage (C4) BO7 beta on all historical BO7; REJECTED for PRIMARY, sensitivity only.
  neutral_format:
    NEUTRAL_FORMAT: >
      Descriptive counterfactual: all 12 teams play a full single round robin of BO5 (66 series); top 8 by series wins
      (then game differential, then lot) enter the SAME double-elimination bracket with a fully random draw (no seeds),
      BO7 throughout. No groups, no protected seeds, no opponent selection, no direct elimination by group.

materiality:
  # pre-registered: an unresolved rule "materially changes championship probabilities" if switching between its
  # bounded scenarios moves any team's championship probability by more than this many absolute probability points,
  # beyond Monte Carlo noise (|delta| > threshold AND |delta| > 4 * combined MC SE).
  championship_abs_threshold: 0.01
simulation:
  n_sims_primary: 1000000
  n_sims_scenario: 1000000
  seed: 20261002
  convergence_checkpoints: [10000, 100000, 500000, 1000000]

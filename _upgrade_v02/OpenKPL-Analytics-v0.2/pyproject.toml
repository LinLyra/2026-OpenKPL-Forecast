[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openkpl"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2","numpy>=1.26","pyarrow>=16","scikit-learn>=1.5","PyYAML>=6.0"]

[project.scripts]
openkpl = "openkpl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
